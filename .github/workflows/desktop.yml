name: desktop
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: npm audit --audit-level=high
        working-directory: desktop
      - run: npm run lint && npm run typecheck && npm test && npm run build
        working-directory: desktop
      - run: npx playwright install --with-deps chromium
        working-directory: desktop
      - run: npm run test:e2e
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-preview-screenshots
          path: |
            docs/desktop/screenshots/*.png
            desktop/test-results/

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos-arm64
            # Tauri's Finder/AppleScript DMG helper is unreliable on hosted macOS runners.
            # Build the .app with Tauri, then create a headless DMG below with hdiutil.
            bundles: app
          - os: windows-latest
            platform: windows-x64
            bundles: nsis
          - os: ubuntu-24.04
            platform: linux-x64
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      MAC_SIGNING: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
      WINDOWS_SIGNING: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && secrets.WINDOWS_CERTIFICATE != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            desktop/src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf fuse3
      - name: Windows compiler environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Pinned WinFsp SDK and hosted driver
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'winfsp-2.1.25156.msi'
          Invoke-WebRequest 'https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi' -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne '073A70E00F77423E34BED98B86E600DEF93393BA5822204FAC57A29324DB9F7A') { throw 'WinFsp checksum mismatch' }
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$installer`" /qn ADDLOCAL=F.Main,F.User,F.Developer /norestart" -Wait -PassThru
          if ($p.ExitCode -notin 0,3010) { throw 'WinFsp installation failed' }
          'LIBCLANG_PATH=C:\Program Files\LLVM\bin' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          'C:\Program Files (x86)\WinFsp\bin' | Out-File $env:GITHUB_PATH -Append -Encoding utf8
      - run: npm ci
        working-directory: desktop
      - name: Prepare verified macFUSE SDK (macOS compile only; no driver install)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install pkgconf
          sdk_root="$RUNNER_TEMP/playsparse-macfuse-sdk"
          mkdir -p "$sdk_root/image"
          image="$sdk_root/macfuse-5.4.0.dmg"
          curl --fail --location --retry 3 --output "$image" \
            https://github.com/macfuse/macfuse/releases/download/macfuse-5.4.0/macfuse-5.4.0.dmg
          expected=861814f0ac7fa8f6547ea40cdd49a36ac84bcc7d34f38a1fa74e8cf68b0401c5
          actual="$(shasum -a 256 "$image" | cut -d ' ' -f 1)"
          test "$actual" = "$expected"
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$sdk_root/image" "$image"
          trap 'hdiutil detach "$sdk_root/image"' EXIT
          pkgutil --check-signature "$sdk_root/image/Install macFUSE.pkg" | tee "$sdk_root/signature.txt"
          grep -Fq 'Benjamin Fleischer (3T5GSNBU6W)' "$sdk_root/signature.txt"
          grep -Fq 'trusted by the Apple notary service' "$sdk_root/signature.txt"
          pkgutil --expand-full "$sdk_root/image/Install macFUSE.pkg" "$sdk_root/sdk"
          hdiutil detach "$sdk_root/image"
          trap - EXIT
          payload="$sdk_root/sdk/Core.pkg/Payload"
          test -f "$payload/usr/local/lib/pkgconfig/fuse.pc"
          {
            echo "PKG_CONFIG_PATH=$payload/usr/local/lib/pkgconfig"
            echo "PKG_CONFIG_SYSROOT_DIR=$payload"
            echo "DYLD_LIBRARY_PATH=$payload/usr/local/lib"
            echo "DYLD_FRAMEWORK_PATH=$payload/Library/Filesystems/macfuse.fs/Contents/Frameworks"
          } >> "$GITHUB_ENV"
      # Tauri validates externalBin when build.rs runs (including Clippy),
      # so the host-specific CLI sidecar must exist before that step.
      - name: Prepare native engine sidecar
        run: npm run engine
        working-directory: desktop
      - run: cargo test --locked -p playsparse-desktop
      - run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Build unsigned development application and installers
        if: (runner.os != 'macOS' || env.MAC_SIGNING != 'true') && (runner.os != 'Windows' || env.WINDOWS_SIGNING != 'true')
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}
        working-directory: desktop
      - name: Build Developer ID application with notarization
        if: runner.os == 'macOS' && env.MAC_SIGNING == 'true'
        working-directory: desktop
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm run tauri build -- --bundles app
          codesign --verify --deep --strict src-tauri/target/release/bundle/macos/PlaySparse.app
          xcrun stapler validate src-tauri/target/release/bundle/macos/PlaySparse.app
      - name: Build Authenticode application and NSIS installer
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING == 'true'
        shell: pwsh
        working-directory: desktop
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'playsparse-signing.pfx'
          $config = Join-Path $env:RUNNER_TEMP 'playsparse-signing.json'
          $cert = $null
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
            @{bundle=@{windows=@{certificateThumbprint=$cert.Thumbprint;digestAlgorithm='sha256';timestampUrl='http://timestamp.digicert.com'}}} | ConvertTo-Json -Depth 5 | Set-Content $config
            npm run tauri build -- --bundles nsis --config $config
            if ($LASTEXITCODE -ne 0) { throw 'Signed build failed' }
            Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
              if ((Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid') { throw 'Invalid installer signature' }
            }
          } finally {
            if ($null -ne $cert) { Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" }
            Remove-Item $pfx,$config -Force -ErrorAction SilentlyContinue
          }
      - name: Create verified macOS development DMG without Finder automation
        if: runner.os == 'macOS'
        shell: bash
        working-directory: desktop
        run: |
          set -euo pipefail

          # The macFUSE SDK is intentionally exposed to Rust compilation above.
          # Do not leak its dynamic-loader paths into Apple's DiskImages tools.
          unset DYLD_LIBRARY_PATH
          unset DYLD_FRAMEWORK_PATH

          app="src-tauri/target/release/bundle/macos/PlaySparse.app"
          dmg_dir="src-tauri/target/release/bundle/dmg"
          staging="$RUNNER_TEMP/playsparse-dmg-staging"
          version="$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')"
          dmg="$dmg_dir/PlaySparse_${version}_aarch64.dmg"

          test -d "$app"
          rm -rf "$staging"
          mkdir -p "$staging" "$dmg_dir"
          ditto "$app" "$staging/PlaySparse.app"
          ln -s /Applications "$staging/Applications"

          rm -f "$dmg"
          hdiutil create \
            -volname "PlaySparse" \
            -srcfolder "$staging" \
            -ov \
            -format UDZO \
            "$dmg"
          hdiutil verify "$dmg"
          test -s "$dmg"

          rm -rf "$staging"

      - name: Build native validation binaries with the platform compiler environment
        run: cargo build --locked --release -p playsparse-desktop --bins
      - name: Package downloadable synthetic validation kit
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/package-kit.py --platform "${{ matrix.platform }}" --commit "$GITHUB_SHA"
          python3 scripts/validation/run-portable.py --kit validation-kit --work "$RUNNER_TEMP/playsparse-portable" --commit "$GITHUB_SHA"
      - name: Preserve validation kit and portable receipt
        uses: actions/upload-artifact@v4
        with:
          name: desktop-validation-kit-${{ matrix.platform }}
          path: |
            validation-kit/
            ${{ runner.temp }}/playsparse-portable/validation-*.json
            ${{ runner.temp }}/playsparse-portable/summary.txt
          if-no-files-found: error
      - name: Preserve executable modes in macOS app
        if: runner.os == 'macOS'
        run: tar -czf desktop/src-tauri/target/release/bundle/PlaySparse-app.tar.gz -C desktop/src-tauri/target/release/bundle/macos PlaySparse.app
      - name: Generate installer checksums
        shell: bash
        run: python3 scripts/validation/checksums.py desktop/src-tauri/target/release/bundle
      - uses: actions/upload-artifact@v4
        with:
          name: playsparse-development-${{ matrix.platform }}
          path: |
            desktop/src-tauri/target/release/bundle/**/*.dmg
            desktop/src-tauri/target/release/bundle/**/*.exe
            desktop/src-tauri/target/release/bundle/**/*.deb
            desktop/src-tauri/target/release/bundle/**/*.AppImage
            desktop/src-tauri/target/release/bundle/*.tar.gz
            desktop/src-tauri/target/release/bundle/SHA256SUMS
          if-no-files-found: error
