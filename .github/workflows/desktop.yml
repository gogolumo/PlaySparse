name: desktop
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: npm audit --audit-level=high
        working-directory: desktop
      - run: npm run lint && npm run typecheck && npm test && npm run build
        working-directory: desktop
      - run: npx playwright install --with-deps chromium
        working-directory: desktop
      - run: npm run test:e2e
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-preview-screenshots
          path: |
            docs/desktop/screenshots/*.png
            desktop/test-results/

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos-arm64
            bundles: app,dmg
          - os: windows-latest
            platform: windows-x64
            bundles: nsis
          - os: ubuntu-24.04
            platform: linux-x64
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            desktop/src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf fuse3
      - name: Windows compiler environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Pinned WinFsp SDK and hosted driver
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'winfsp-2.1.25156.msi'
          Invoke-WebRequest 'https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi' -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne '073A70E00F77423E34BED98B86E600DEF93393BA5822204FAC57A29324DB9F7A') { throw 'WinFsp checksum mismatch' }
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$installer`" /qn ADDLOCAL=F.Main,F.User,F.Developer /norestart" -Wait -PassThru
          if ($p.ExitCode -notin 0,3010) { throw 'WinFsp installation failed' }
          'LIBCLANG_PATH=C:\Program Files\LLVM\bin' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          'C:\Program Files (x86)\WinFsp\bin' | Out-File $env:GITHUB_PATH -Append -Encoding utf8
      - run: npm ci
        working-directory: desktop
      - name: Prepare verified macFUSE SDK (macOS compile only; no driver install)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install pkgconf
          sdk_root="$RUNNER_TEMP/playsparse-macfuse-sdk"
          mkdir -p "$sdk_root/image"
          image="$sdk_root/macfuse-5.4.0.dmg"
          curl --fail --location --retry 3 --output "$image" \
            https://github.com/macfuse/macfuse/releases/download/macfuse-5.4.0/macfuse-5.4.0.dmg
          expected=861814f0ac7fa8f6547ea40cdd49a36ac84bcc7d34f38a1fa74e8cf68b0401c5
          actual="$(shasum -a 256 "$image" | cut -d ' ' -f 1)"
          test "$actual" = "$expected"
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$sdk_root/image" "$image"
          trap 'hdiutil detach "$sdk_root/image"' EXIT
          pkgutil --check-signature "$sdk_root/image/Install macFUSE.pkg" | tee "$sdk_root/signature.txt"
          grep -Fq 'Benjamin Fleischer (3T5GSNBU6W)' "$sdk_root/signature.txt"
          grep -Fq 'trusted by the Apple notary service' "$sdk_root/signature.txt"
          pkgutil --expand-full "$sdk_root/image/Install macFUSE.pkg" "$sdk_root/sdk"
          hdiutil detach "$sdk_root/image"
          trap - EXIT
          payload="$sdk_root/sdk/Core.pkg/Payload"
          test -f "$payload/usr/local/lib/pkgconfig/fuse.pc"
          {
            echo "PKG_CONFIG_PATH=$payload/usr/local/lib/pkgconfig"
            echo "PKG_CONFIG_SYSROOT_DIR=$payload"
            echo "DYLD_LIBRARY_PATH=$payload/usr/local/lib"
            echo "DYLD_FRAMEWORK_PATH=$payload/Library/Filesystems/macfuse.fs/Contents/Frameworks"
          } >> "$GITHUB_ENV"
      # Tauri validates externalBin when build.rs runs (including Clippy),
      # so the host-specific CLI sidecar must exist before that step.
      - name: Prepare native engine sidecar
        run: npm run engine
        working-directory: desktop
      - run: cargo test --locked -p playsparse-desktop
      - run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Build unsigned development application and installers
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}
        working-directory: desktop
      - name: Preserve executable modes in macOS app
        if: runner.os == 'macOS'
        run: tar -czf desktop/src-tauri/target/release/bundle/PlaySparse-app.tar.gz -C desktop/src-tauri/target/release/bundle/macos PlaySparse.app
      - uses: actions/upload-artifact@v4
        with:
          name: playsparse-development-${{ matrix.platform }}
          path: |
            desktop/src-tauri/target/release/bundle/**/*.dmg
            desktop/src-tauri/target/release/bundle/**/*.exe
            desktop/src-tauri/target/release/bundle/**/*.deb
            desktop/src-tauri/target/release/bundle/**/*.AppImage
            desktop/src-tauri/target/release/bundle/*.tar.gz
          if-no-files-found: error
