name: rust-runtime

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-sdk:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install SDK inspection build tool
        run: brew install pkgconf
      - name: Verified macFUSE SDK compile, link and tests without driver installation
        run: python3 tools/macos-sdk-check.py --work "$RUNNER_TEMP/playsparse-macos-sdk"
      - name: Preserve SDK evidence; this job does not validate mounted macOS I/O
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-sdk-evidence
          path: |
            ${{ runner.temp }}/playsparse-macos-sdk/result.json
            ${{ runner.temp }}/playsparse-macos-sdk/*.log
          if-no-files-found: warn

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install genuine FUSE mount dependencies
        run: sudo apt-get update && sudo apt-get install -y fuse3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked --release --workspace
      - name: Real mounted application and 64-bit I/O test
        run: sudo python3 tools/mounted-smoke.py --work /tmp/playsparse-mounted-ci --world-bytes 10737418240 --iterations 32 --cache 64M
      - name: Real writable overlay, updater, remount and trace
        run: sudo python3 tools/mounted-update.py --work /tmp/playsparse-update-ci
      - name: Real mounted adaptive capture and identical trace replay
        run: sudo python3 tools/adaptive-smoke.py --work /tmp/playsparse-adaptive-ci
      - name: Real mounted tier promotion, offline remount and HTTP ranges
        run: sudo python3 tools/tiered-smoke.py --work /tmp/playsparse-tiered-ci
      - name: Object-write and manifest-write kill tests, real ENOSPC
        run: |
          sudo mkdir /tmp/playsparse-enospc
          sudo mount -t tmpfs -o size=1M tmpfs /tmp/playsparse-enospc
          sudo python3 tools/crash-smoke.py --work /tmp/playsparse-crash-ci --disk-full-dir /tmp/playsparse-enospc
          sudo umount /tmp/playsparse-enospc
      - name: Loose versus packfiles experiment
        run: python3 experiments/04-loose-vs-packfiles/run_benchmark.py --output /tmp/playsparse-experiment04-ci --repetitions 2 --iterations 64 --size-mib 32
      - name: Preserve raw measured evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-runtime-evidence
          path: |
            /tmp/playsparse-mounted-ci/evidence
            /tmp/playsparse-update-ci/evidence
            /tmp/playsparse-adaptive-ci/evidence
            /tmp/playsparse-tiered-ci/evidence
            /tmp/playsparse-crash-ci/evidence
            /tmp/playsparse-experiment04-ci
          if-no-files-found: warn

  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned upstream WinFsp driver and SDK
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'winfsp-2.1.25156.msi'
          $installerLog = Join-Path $env:RUNNER_TEMP 'winfsp-install.log'
          Invoke-WebRequest 'https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi' -OutFile $installer
          $expected = '073A70E00F77423E34BED98B86E600DEF93393BA5822204FAC57A29324DB9F7A'
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne $expected) { throw 'WinFsp installer checksum mismatch' }
          $install = Start-Process msiexec.exe -ArgumentList "/i `"$installer`" /qn ADDLOCAL=F.Main,F.User,F.Developer /norestart /l*v `"$installerLog`"" -Wait -PassThru
          if ($install.ExitCode -notin 0,3010) {
            Get-Content $installerLog -Tail 80
            throw "WinFsp install failed: $($install.ExitCode)"
          }
          'C:\Program Files (x86)\WinFsp\bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          'LIBCLANG_PATH=C:\Program Files\LLVM\bin' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked --release --workspace
      - name: Native WinFsp mounted application and memory mapping
        shell: pwsh
        run: |
          python tools/mounted-smoke.py --work "$env:RUNNER_TEMP\playsparse-mounted-ci" --playsparse target/release/playsparse.exe --io-probe target/release/io-probe.exe --world-bytes 10737418240 --iterations 32 --cache 64M
          if ($LASTEXITCODE -ne 0) { throw 'Windows mounted runtime test failed' }
      - name: Parse optional physical-hardware harness
        shell: pwsh
        run: |
          $tokens = $null; $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path tools/windows-hardware-validation.ps1), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { $parseErrors | Format-List; throw 'Hardware harness syntax errors' }
      - name: Native WinFsp writable updater, remount and trace
        shell: pwsh
        run: |
          python tools/mounted-update.py --work "$env:RUNNER_TEMP\playsparse-update-ci" --playsparse target/release/playsparse.exe --io-probe target/release/io-probe.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows mounted update test failed' }
      - name: Native WinFsp adaptive capture and identical trace replay
        shell: pwsh
        run: |
          python tools/adaptive-smoke.py --work "$env:RUNNER_TEMP\playsparse-adaptive-ci" --playsparse target/release/playsparse.exe --io-probe target/release/io-probe.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows adaptive mounted test failed' }
      - name: Native WinFsp tier promotion, offline remount and HTTP ranges
        shell: pwsh
        run: |
          python tools/tiered-smoke.py --work "$env:RUNNER_TEMP\playsparse-tiered-ci" --playsparse target/release/playsparse.exe --io-probe target/release/io-probe.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows mounted tier test failed' }
      - name: Preserve native Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-runtime-evidence
          path: |
            ${{ runner.temp }}/playsparse-mounted-ci/evidence
            ${{ runner.temp }}/playsparse-update-ci/evidence
            ${{ runner.temp }}/playsparse-adaptive-ci/evidence
            ${{ runner.temp }}/playsparse-tiered-ci/evidence
            ${{ runner.temp }}/winfsp-install.log
          if-no-files-found: warn
