  <text x="96" y="296" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="44" font-weight="700">STORE LESS.</text>
  <text x="96" y="352" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="44" font-weight="700">SERVE THE SAME FILES.</text>
  <text x="96" y="414" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24">Experimental adaptive virtual storage runtime</text>
