  <text x="940" y="214" text-anchor="middle" fill="#64748b" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">application view</text>
  <path d="M940 240 L940 290" stroke="#64748b" stroke-width="4"/><path d="M930 278 L940 292 L950 278" fill="none" stroke="#64748b" stroke-width="4"/>
  <rect x="760" y="294" width="360" height="104" rx="18" fill="#111827" stroke="#22d3ee" stroke-width="2.5"/>
  <text x="940" y="334" text-anchor="middle" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="19" font-weight="700">PlaySparse</text>
  <text x="940" y="365" text-anchor="middle" fill="#67e8f9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">range resolver + cache</text>
  <path d="M940 398 L940 448" stroke="#64748b" stroke-width="4"/><path d="M930 436 L940 450 L950 436" fill="none" stroke="#64748b" stroke-width="4"/>
  <rect x="760" y="452" width="360" height="90" rx="18" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="940" y="488" text-anchor="middle" fill="#e2e8f0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16">BLAKE3 · Zstd · packfiles</text>
  <text x="940" y="518" text-anchor="middle" fill="#64748b" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">verified storage tiers</text>
  <text x="96" y="560" fill="#64748b" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16">RUST · FUSE · WINFSP · CONTENT-ADDRESSED STORAGE</text>
