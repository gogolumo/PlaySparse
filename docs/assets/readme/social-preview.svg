<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">PlaySparse social preview</title>
  <desc id="desc">PlaySparse adaptive virtual storage runtime with the tagline Store less. Serve the same files.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08111f"/><stop offset="1" stop-color="#14142b"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1070" cy="110" r="260" fill="#8b5cf6" opacity=".10"/>
  <circle cx="120" cy="610" r="300" fill="#22d3ee" opacity=".08"/>
  <text x="96" y="170" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="72" font-weight="800">PlaySparse</text>
