<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">PlaySparse runtime architecture</title>
  <desc id="desc">The application reads through FUSE or WinFsp into a merged namespace and immutable range resolver, backed by cache, tracing, policy, prefetch and verified storage tiers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  </defs>
  <rect width="1400" height="760" rx="28" fill="url(#bg)"/>
  <text x="64" y="72" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="34" font-weight="700">Runtime architecture</text>
  <text x="64" y="108" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18">Immutable data plane + optional mutable and adaptive layers</text>
  <rect x="500" y="140" width="400" height="76" rx="16" fill="#111827" stroke="#475569" stroke-width="2"/>
  <text x="700" y="172" text-anchor="middle" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="700">APPLICATION / GAME</text>
  <text x="700" y="198" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">ordinary filesystem syscalls</text>
  <line x1="700" y1="216" x2="700" y2="250" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="470" y="264" width="460" height="82" rx="16" fill="#0f172a" stroke="#22d3ee" stroke-width="2.5"/>
  <text x="700" y="297" text-anchor="middle" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="700">FUSE / WinFsp callback adapter</text>
  <text x="700" y="324" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">bounded reads · stable handles · platform translation</text>
  <line x1="700" y1="346" x2="700" y2="382" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="180" y="396" width="420" height="118" rx="18" fill="#111827" stroke="#8b5cf6" stroke-width="2"/>
  <text x="390" y="432" text-anchor="middle" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" font-weight="700">MERGED NAMESPACE</text>
  <text x="390" y="462" text-anchor="middle" fill="#c4b5fd" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">persistent overlay</text>
  <text x="390" y="489" text-anchor="middle" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13">copy-on-write · tombstones · remount</text>
  <rect x="800" y="396" width="420" height="118" rx="18" fill="#111827" stroke="#22d3ee" stroke-width="2"/>
  <text x="1010" y="432" text-anchor="middle" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" font-weight="700">IMMUTABLE RANGE RESOLVER</text>
  <text x="1010" y="462" text-anchor="middle" fill="#67e8f9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">manifest + chunk index</text>
  <text x="1010" y="489" text-anchor="middle" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13">only intersecting chunks are loaded</text>
  <path d="M700 382 L390 382 L390 396" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M700 382 L1010 382 L1010 396" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="600" y1="455" x2="786" y2="455" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="693" y="439" text-anchor="middle" fill="#64748b" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">base reads</text>
  <rect x="790" y="558" width="250" height="92" rx="16" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <text x="915" y="592" text-anchor="middle" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="700">BYTE CACHE</text>
  <text x="915" y="621" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">LRU / policy retention</text>
  <rect x="1090" y="558" width="246" height="92" rx="16" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <text x="1213" y="592" text-anchor="middle" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="700">VERIFIED OBJECTS</text>
  <text x="1213" y="621" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">local · secondary · HTTP</text>
  <line x1="1010" y1="514" x2="915" y2="548" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1040" y1="604" x2="1076" y2="604" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="64" y="566" width="250" height="88" rx="16" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <text x="189" y="598" text-anchor="middle" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="700">ACCESS TRACE</text>
  <text x="189" y="626" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">bounded JSONL</text>
  <rect x="352" y="566" width="250" height="88" rx="16" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <text x="477" y="598" text-anchor="middle" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="700">POLICY</text>
  <text x="477" y="626" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">hotness · bounded prefetch</text>
  <path d="M840 514 C700 544 500 534 314 590" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
  <line x1="314" y1="610" x2="338" y2="610" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M602 610 C700 610 735 600 790 600" fill="none" stroke="#8b5cf6" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
  <text x="64" y="704" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15">Default path: immutable store + static byte-bounded LRU.</text>
  <text x="64" y="730" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14">Overlay, tracing, adaptive policy and tiering are optional experimental capabilities.</text>
</svg>