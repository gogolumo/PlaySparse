[package]
name = "playsparse-app"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]

[lib]
name = "playsparse_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
playsparse-desktop = { path = "../../crates/playsparse-desktop" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

