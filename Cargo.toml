[workspace]
resolver = "2"
members = ["crates/playsparse-core", "crates/playsparse-store", "crates/playsparse-cache", "crates/playsparse-range", "crates/playsparse-cli", "crates/playsparse-vfs-fuse", "crates/playsparse-vfs-win", "tools/io-probe", "crates/playsparse-trace", "crates/playsparse-overlay", "crates/playsparse-policy", "crates/playsparse-game", "crates/playsparse-desktop"]

exclude = ["desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
blake3 = "1.8.7"
clap = { version = "4", features = ["derive"] }
fastcdc = "5.0"
zstd = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"
lru = "0.18.5"
tempfile = "3"
proptest = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
libc = "0.2"
walkdir = "2"
memmap2 = "0.9.11"
ctrlc = "3"

[profile.release]
lto = "thin"
codegen-units = 1
